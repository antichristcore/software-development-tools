name: Daily commit

on:
  schedule:
    # Несколько попыток в день: GitHub иногда пропускает запуски по расписанию.
    # Коммит делается только один раз за день (по Москве).
    - cron: "23 3,7,11,15,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create next numbered file if there is no commit today
        env:
          TZ: Europe/Moscow
        run: |
          today=$(date +%Y-%m-%d)
          last_commit_day=$(git log -1 --format=%cd --date=format-local:%Y-%m-%d)
          if [ "$last_commit_day" = "$today" ]; then
            echo "Сегодня ($today) коммит уже есть, пропускаю"
            exit 0
          fi
          last=$(ls | grep -E '^[0-9]+$' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "$next" > "$next"
          git config user.name "axm"
          git config user.email "124406261+antichristcore@users.noreply.github.com"
          git add "$next"
          git commit -m "Create $next"
          git push
